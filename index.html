<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#E2650F">
<meta name="robots" content="noindex,nofollow">
<title>Portfolio Banking Game</title>
<style>@font-face{font-family:Mulish;font-style:normal;font-weight:400;font-display:swap;src:url(vendor/fonts/mulish-latin-400-normal.woff2) format("woff2")}@font-face{font-family:Mulish;font-style:normal;font-weight:600;font-display:swap;src:url(vendor/fonts/mulish-latin-600-normal.woff2) format("woff2")}@font-face{font-family:Mulish;font-style:normal;font-weight:700;font-display:swap;src:url(vendor/fonts/mulish-latin-700-normal.woff2) format("woff2")}@font-face{font-family:Mulish;font-style:normal;font-weight:800;font-display:swap;src:url(vendor/fonts/mulish-latin-800-normal.woff2) format("woff2")}@font-face{font-family:Mulish;font-style:normal;font-weight:900;font-display:swap;src:url(vendor/fonts/mulish-latin-900-normal.woff2) format("woff2")}</style>
<script src="config.js"></script>
<style>
/* ================= TOKENS ================= */
:root{
  --brand:#E2650F; --brand-2:#F28A3C; --brand-deep:#B34E08; --maroon:#8F1D2C; --gold:#F2A900;
  --bg:#FBF5EF; --surface:#FFFFFF; --surface-2:#FFF7F0; --ink:#231A14; --muted:#6E6159; --line:#EADBCF; --line-2:#F3E8DE;
  --good:#17714A; --good-bg:#E3F3EA; --warn:#9A5600; --warn-bg:#FFF0D9; --alert:#A1302B; --alert-bg:#FBE8E5; --info:#0F5E85; --info-bg:#E4F1F8;
  --shadow:0 1px 2px rgba(70,35,10,.07),0 8px 24px rgba(70,35,10,.08);
  --r:14px;
  /* projector stage: dark by default */
  --st-bg:#140906; --st-bg2:#34160E; --st-panel:rgba(255,248,240,.07); --st-panel-2:rgba(255,248,240,.12); --st-line:rgba(255,236,220,.14); --st-ink:#FFF5EC; --st-muted:#D7C2B2; --st-bar:rgba(10,4,2,.45);
  /* board: always a warm light surface for contrast on projectors */
  --tile:#FFFDF9; --tile-ink:#24170F; --tile-muted:#7A6A5E; --lb-open:#EFE5DA; --lb-open-ink:#5B4A3E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15110E; --surface:#211A15; --surface-2:#2A211B; --ink:#F6EEE7; --muted:#BBA99B; --line:#3B3028; --line-2:#2F261F;
    --good:#5FD39A; --good-bg:#16352A; --warn:#F2B35E; --warn-bg:#3A2A12; --alert:#F08A80; --alert-bg:#3D1C19; --info:#7CC4EA; --info-bg:#132D3B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15110E; --surface:#211A15; --surface-2:#2A211B; --ink:#F6EEE7; --muted:#BBA99B; --line:#3B3028; --line-2:#2F261F;
  --good:#5FD39A; --good-bg:#16352A; --warn:#F2B35E; --warn-bg:#3A2A12; --alert:#F08A80; --alert-bg:#3D1C19; --info:#7CC4EA; --info-bg:#132D3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --st-bg:#EADCCD; --st-bg2:#FBF3EA; --st-panel:#FFFFFF; --st-panel-2:#FFF7F0; --st-line:#E1CFBE; --st-ink:#231A14; --st-muted:#6E6159; --st-bar:rgba(255,255,255,.78);
}

/* ================= BASE ================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Mulish,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
html.phone-mode,html.phone-mode body{height:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.hidden{display:none !important}
.ico{width:1.15em;height:1.15em;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 15px;font-weight:800;font-size:15px;min-height:42px;transition:transform .08s ease,background .15s ease,box-shadow .15s ease}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:var(--brand-deep);color:#fff;box-shadow:0 4px 14px rgba(226,101,15,.35)}
.btn.primary:hover{background:linear-gradient(180deg,var(--brand),var(--brand-deep))}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px;border-radius:9px}
.btn.big{min-height:62px;font-size:20px;border-radius:15px;padding:12px 22px;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:800;text-decoration:underline;padding:0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:800;background:var(--surface-2);border:1px solid var(--line)}
.tk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--g);color:var(--gi,#fff);font-weight:900;font-size:13px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 1px 3px rgba(0,0,0,.3)}
.tk.ph{background:var(--line);box-shadow:none}
.tier{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:800;color:#fff;letter-spacing:.02em}
.tier.t0{background:#8A6A4A}.tier.t1{background:#0F6E8C}.tier.t2{background:#8F1D2C}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.field small{font-size:12px;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.input.big{min-height:54px;font-size:20px;font-weight:700}
.input:focus{outline:2px solid var(--brand);outline-offset:1px}
.wordmark{font-weight:900;letter-spacing:.14em;color:var(--brand);white-space:nowrap}
.wordmark b{color:var(--maroon)}
.wordmark.sm{font-size:18px}
.wordmark.xl{font-size:clamp(40px,8vw,76px)}
.note{font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#9b8b80;flex:none;display:inline-block}
.dot.on{background:#2FB36D;box-shadow:0 0 0 3px rgba(47,179,109,.2)}
.star{color:var(--gold)}
.badge{display:inline-flex;align-items:center;border-radius:6px;padding:0 7px;font-size:12px;font-weight:800;line-height:1.75}
.badge.up{background:var(--good-bg);color:var(--good)}
.badge.dn{background:var(--alert-bg);color:var(--alert)}
.badge.hold{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:var(--info-bg);color:var(--info)}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#231A14;color:#FFF5EC;padding:11px 18px;border-radius:12px;font-weight:800;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:90vw;animation:toastin .25s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700}

/* ================= LANDING ================= */
.landing{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));background:radial-gradient(1200px 600px at 50% -10%,rgba(226,101,15,.14),transparent 70%),var(--bg)}
.hero{text-align:center;max-width:760px;margin:16px 0 30px}
.hero p{font-size:18px;color:var(--muted);margin-top:10px}
.hero-strip{display:flex;gap:7px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.hero-strip span{width:38px;height:9px;border-radius:5px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%;max-width:1040px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:20px}
.panel .ic{font-size:32px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;color:var(--muted)}
.resume{display:flex;flex-direction:column;gap:6px}

/* ================= PROJECTOR STAGE ================= */
.disp{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;color:var(--st-ink);background:radial-gradient(1500px 1000px at 50% 48%,var(--st-bg2) 0%,var(--st-bg) 72%);position:relative}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));background:var(--st-bar);border-bottom:1px solid var(--st-line);backdrop-filter:blur(8px);position:relative;z-index:30}
.tb-l,.tb-r{display:flex;align-items:center;gap:10px;min-width:0}
.tb-r{flex-wrap:nowrap;justify-content:flex-end}
.topbar .wordmark{font-size:22px;color:var(--brand-2)}
:root[data-theme="light"] .topbar .wordmark{color:var(--brand)}
.codechip{display:inline-flex;align-items:center;gap:7px;font-weight:900;letter-spacing:.2em;font-size:18px;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:5px 12px}
.demo-chip{background:var(--st-panel-2);color:var(--st-ink);border-color:var(--st-line)}
.roundchip{font-weight:800;font-size:15px;color:var(--st-muted);white-space:nowrap}
.roundchip b{color:var(--st-ink);font-size:18px}
.turnchip{display:inline-flex;align-items:center;gap:9px;background:var(--g);color:var(--gi);font-weight:900;border-radius:99px;padding:6px 14px 6px 10px;font-size:15px;white-space:nowrap;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 18px color-mix(in srgb,var(--g) 60%,transparent)}
.turnchip .pulse{width:11px;height:11px;border-radius:50%;background:var(--gi);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.tbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--st-line);background:var(--st-panel);color:var(--st-ink);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.tbtn:hover{background:var(--st-panel-2)}
.tbtn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:var(--brand-deep);color:#fff;box-shadow:0 4px 16px rgba(226,101,15,.4)}
.ibtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--st-line);background:var(--st-panel);color:var(--st-ink);padding:0}
.ibtn:hover{background:var(--st-panel-2)}
.ibtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ibtn.off{opacity:.55}
.tb-sep{width:1px;height:28px;background:var(--st-line);margin:0 2px}
.sizer{display:inline-flex;align-items:center;gap:4px}
.sizer .sz{font-size:12px;font-weight:800;color:var(--st-muted);min-width:34px;text-align:center}
.warnchip{background:rgba(255,190,90,.15);color:#F6C27A;border-color:rgba(255,190,90,.3)}
.scorestrip{display:flex;gap:6px}
.ss{display:inline-flex;align-items:center;gap:6px;background:var(--g);color:var(--gi);font-weight:900;border-radius:99px;padding:4px 10px 4px 4px;font-size:14px}
.ss i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.28);font-size:12px}
@media (max-width:1500px){.tbtn span{display:none}.tbtn.primary span{display:inline}.tbtn{padding:8px 10px}}
@media (max-width:1100px){.sizer,.roundchip{display:none}}

.stage{--side:clamp(160px,19vw,420px);--bsz:min(calc((100dvh - 92px) * var(--scale)),calc(100vw - 2 * var(--side) - 80px));position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--bsz) minmax(0,1fr);grid-template-areas:"tl board tr";grid-template-rows:minmax(0,1fr);gap:24px;align-items:center;padding:12px max(18px,env(safe-area-inset-right)) 14px max(18px,env(safe-area-inset-left));min-height:0;height:100%}
.stage.demo{--bsz:min(calc((100dvh - 92px) * var(--scale)),calc(100vw - 390px - var(--side) - 100px));grid-template-columns:minmax(0,1fr) var(--bsz) 390px;grid-template-areas:"tl board dock"}
.stage.demo .tr{display:none}
.disp[data-focus="1"] .stage{--bsz:min(calc((100dvh - 92px) * var(--scale)),calc(100vw - 48px));grid-template-columns:0 var(--bsz) 0;gap:0;justify-content:center}
.disp[data-focus="1"] .stage.demo{--bsz:min(calc((100dvh - 92px) * var(--scale)),calc(100vw - 390px - 72px));grid-template-columns:0 var(--bsz) 390px;gap:18px}
.disp[data-focus="1"] .teams{display:none}
.tl{grid-area:tl}.tr{grid-area:tr}.dock{grid-area:dock}
.boardwrap{grid-area:board;width:var(--bsz);height:var(--bsz);justify-self:center;align-self:center}
@media (max-aspect-ratio:1/1){
  .disp{height:auto;min-height:100dvh;overflow:visible}
  .stage,.stage.demo,.disp[data-focus="1"] .stage{--bsz:min(calc(100vw - 32px),calc((100dvh - 92px) * var(--scale) * 1.2));grid-template-columns:1fr;grid-template-areas:"board" "tl" "tr" "dock"}
  .stage.demo .tr{display:none}
  .teams{flex-direction:row;flex-wrap:wrap}
  .teams .tcard{flex:1 1 260px}
}

/* ---------- board ---------- */
.board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:13fr repeat(7,10fr) 13fr;grid-template-rows:13fr repeat(7,10fr) 13fr;gap:.32cqw;padding:.55cqw;background:linear-gradient(145deg,#4C2318,#2A110B);border-radius:2.2cqw;container-type:inline-size;box-shadow:0 2.5cqw 6cqw rgba(0,0,0,.5),inset 0 0 0 .22cqw rgba(255,255,255,.07);transition:box-shadow .5s}
.board.has-turn{box-shadow:0 0 0 .5cqw var(--turn),0 0 5cqw color-mix(in srgb,var(--turn) 55%,transparent),0 2.5cqw 6cqw rgba(0,0,0,.5);animation:turnglow 2.6s ease-in-out infinite}
@keyframes turnglow{50%{box-shadow:0 0 0 .5cqw var(--turn),0 0 2cqw color-mix(in srgb,var(--turn) 35%,transparent),0 2.5cqw 6cqw rgba(0,0,0,.5)}}
.cell{position:relative;background:var(--tile);color:var(--tile-ink);border-radius:.8cqw;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:.65cqw .35cqw 3.15cqw;box-shadow:inset 0 -.15cqw 0 rgba(0,0,0,.07);transition:background .4s,box-shadow .4s}
.cell .t-ic{font-size:3.3cqw;line-height:1.08;margin-top:.15cqw}
.cell .t-nm{font-size:1.2cqw;font-weight:800;line-height:1.12;margin-top:.35cqw;letter-spacing:.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;hyphens:manual}
.cell.s-left,.cell.s-right{flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;gap:.6cqw;padding:.4cqw .7cqw 3.15cqw}
.cell.s-left .t-ic,.cell.s-right .t-ic{margin:0;font-size:3cqw}
.cell.s-left .t-nm,.cell.s-right .t-nm{margin:0;font-size:1.12cqw;-webkit-line-clamp:3;min-width:0;flex:1}
.t-lb{position:absolute;left:.32cqw;right:.32cqw;bottom:.32cqw;height:2.45cqw;border-radius:.55cqw;display:flex;align-items:center;justify-content:center;gap:.3cqw;font-size:1.3cqw;overflow:hidden;font-weight:900;background:var(--lb-open);color:var(--lb-open-ink);white-space:nowrap;transition:background .5s,color .5s}
.t-lb .t-st{font-size:.8cqw;letter-spacing:.02em;opacity:.85}
.t-lb.open .t-st{font-weight:800}
.t-tag{display:inline-grid;place-items:center;width:1.6cqw;height:1.6cqw;border-radius:50%;background:rgba(255,255,255,.3);font-size:.95cqw;flex:none}
.t-hold{font-size:1.1cqw}
.cell.owned{background:color-mix(in srgb,var(--g) 14%,var(--tile));box-shadow:inset 0 0 0 .3cqw var(--g)}
.cell.owned .t-lb{background:var(--g);color:var(--gi)}
.cell.owned .t-lb .t-st{opacity:1;color:inherit}
.cell.upready .t-lb{background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);background-size:250% 100%;animation:shimmer 2s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.cell.hold .t-lb{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 .5cqw,transparent .5cqw 1cqw)}
.cell.corner{justify-content:center;padding:.8cqw;gap:.3cqw}
.cell.corner .t-ic{font-size:5cqw}
.cell.corner .t-nm{font-size:1.42cqw;font-weight:900;text-transform:uppercase;letter-spacing:.03em;-webkit-line-clamp:3}
.cell.corner > *{flex-shrink:0}
.cell.corner.long .t-ic{font-size:3.7cqw}
.cell.corner.long .t-nm{font-size:1.3cqw;letter-spacing:.01em}
.t-sub{font-size:1.1cqw;font-weight:800;color:var(--tile-muted)}
.cell.k-start{background:linear-gradient(160deg,#E9F7EE,#CDEBD7)}
.cell.k-rbi{background:linear-gradient(160deg,#FFF5E6,#FFE0B8)}
.cell.k-jail{background:linear-gradient(160deg,#EEF1F5,#D5DCE6)}
.cell.k-reg{background:linear-gradient(160deg,#F3EDFC,#DFD1F5)}
.cell.k-mkt{background:linear-gradient(160deg,#FFF2E5,#FFD9B5)}
.cell.k-mkt .t-sub{position:absolute;left:.32cqw;right:.32cqw;bottom:.32cqw;height:2.45cqw;border-radius:.55cqw;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:1.15cqw}
.cell.land{z-index:3;outline:.45cqw solid var(--turn,var(--brand));outline-offset:-.1cqw;animation:landpulse 1.3s ease-in-out infinite}
@keyframes landpulse{50%{outline-offset:.35cqw;outline-color:color-mix(in srgb,var(--turn,var(--brand)) 40%,transparent)}}
.cell.step{animation:stepflash .55s ease-out}
@keyframes stepflash{0%{box-shadow:inset 0 0 0 .5cqw var(--turn,var(--brand));filter:brightness(1.12)}100%{filter:none}}
.cell.won{animation:won 1.2s ease-out}
@keyframes won{0%{transform:scale(1)}25%{transform:scale(1.12);box-shadow:0 0 0 .6cqw var(--g),0 0 4cqw var(--g);z-index:4}100%{transform:scale(1)}}
.cell.tierup .t-lb{animation:tierup 1.4s ease-out}
@keyframes tierup{0%,100%{transform:none}30%{transform:scale(1.18)}}

.center{grid-row:2/9;grid-column:2/9;border-radius:1.6cqw;background:radial-gradient(circle at 50% 38%,#FFFAF4 0%,#F7EADD 62%,#EED9C4 100%);color:#24170F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25cqw;padding:2.4cqw 2.8cqw;text-align:center;position:relative;overflow:hidden;min-height:0;--ink:#24170F;--muted:#6E5A4C;--line:#E6D4C2;--surface:#FFFFFF;--surface-2:#FFF7F0}
.center::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(143,29,44,.025) 0 1.2cqw,transparent 1.2cqw 2.4cqw);pointer-events:none}
.center > *{position:relative}
.cx-word{font-size:7cqw;font-weight:900;letter-spacing:.14em;color:var(--brand);line-height:1}
.cx-word b{color:var(--maroon)}
.cx-sub{font-size:1.75cqw;color:#6E5A4C;font-weight:800}
.cx-hint{font-size:2.05cqw;font-weight:700;color:#5E4B3F}
.cx-hint b{color:#24170F}
.cx-kicker{display:inline-flex;align-items:center;gap:1cqw;font-size:1.7cqw;font-weight:800;color:#5E4B3F;background:#fff;border:1px solid #E6D4C2;border-radius:99px;padding:.45cqw 1.6cqw .45cqw .6cqw}
.cx-kicker .tk{width:2.8cqw;height:2.8cqw;font-size:1.4cqw}
.cx-turn{font-size:3.2cqw;font-weight:900}
.cx-turn b{font-size:4.6cqw;color:var(--maroon)}
.cx-next{display:flex;align-items:center;gap:1.4cqw;background:var(--g);color:var(--gi);border-radius:2cqw;padding:1.1cqw 2.4cqw 1.1cqw 1.2cqw;box-shadow:0 1cqw 2.5cqw color-mix(in srgb,var(--g) 40%,transparent);text-align:left}
.cx-next b{display:block;font-size:3.2cqw;line-height:1.05;font-weight:900}
.cx-next span{font-size:1.75cqw;font-weight:700;opacity:.95}
.cx-next em{font-style:normal;font-weight:900;text-decoration:underline;text-underline-offset:.3cqw}
.tk.big{width:6cqw;height:6cqw;font-size:2.9cqw;box-shadow:0 0 0 .4cqw rgba(255,255,255,.7)}
.hostbtn{font-size:max(12px,1.1cqw);opacity:.75;border-color:#E2CDB9 !important;background:rgba(255,255,255,.5) !important;color:#5E4B3F !important;min-height:0 !important;padding:.4cqw 1.2cqw !important}
.hostbtn:hover{opacity:1}
.cx-res{display:flex;flex-direction:column;align-items:center;gap:.7cqw;padding:1.5cqw 2.4cqw;border-radius:1.8cqw;width:100%;max-width:64cqw;border:.25cqw solid transparent}
.cx-res.good{background:#E3F3EA;color:#14653F;border-color:#9FD5B6}
.cx-res.warn{background:#FFF0D9;color:#8A4D00;border-color:#F3CB8E}
.cx-res.info{background:#E7F1F8;color:#0F5E85;border-color:#B4D3E7}
.cx-res.alert{background:#FBE8E5;color:#962A24;border-color:#EDB1A9}
.cx-res.pay{background:color-mix(in srgb,var(--g) 12%,#fff);color:#24170F;border-color:var(--g)}
.cx-res .big{font-size:3.1cqw;font-weight:900;line-height:1.1}
.cx-res .why{font-size:1.85cqw;font-weight:700;color:#3A2A20}
.cx-lines{display:flex;flex-wrap:wrap;gap:.8cqw;justify-content:center}
.cx-lines .chip{font-size:1.5cqw;padding:.35cqw 1.1cqw;background:#fff;border-color:#E6D4C2;color:#3A2A20}
.mini-dice .dice{gap:1cqw}
.cx-card{width:100%;max-width:66cqw;background:#fff;border:1px solid #E6D4C2;border-radius:2cqw;box-shadow:0 1.4cqw 3.4cqw rgba(60,25,10,.18);overflow:hidden;text-align:left}
.cx-card .hd{display:flex;align-items:center;gap:1.3cqw;padding:1.3cqw 1.8cqw;background:var(--band,var(--maroon));color:#fff}
.cx-card .hd.lt{color:#2b1d00}
.cx-card .hd > div:not(.cd){flex:1;min-width:0}
.cx-card .hd .ic{font-size:3.8cqw;line-height:1}
.cx-card .hd h3{font-size:2.6cqw;font-weight:900;letter-spacing:.01em}
.cx-card .hd small{display:block;font-size:1.4cqw;font-weight:800;opacity:.92}
.cx-card.ev .hd{background:linear-gradient(120deg,var(--maroon),#5E1220)}
.cx-card .bd{padding:1.7cqw 2cqw;display:flex;flex-direction:column;gap:1.3cqw}
.cx-prob{font-size:2.6cqw;font-weight:800;line-height:1.28;color:#24170F}
.cx-prob.sm{font-size:1.9cqw;font-weight:700}
.cx-opts{display:grid;grid-template-columns:1fr 1fr;gap:1cqw}
.cx-opts.all{grid-template-columns:repeat(3,1fr);gap:.7cqw}
.cx-opt{display:flex;align-items:center;gap:.9cqw;border:.15cqw solid #E6D4C2;border-radius:1.1cqw;padding:1cqw 1.2cqw;font-size:2.1cqw;font-weight:800;background:#FFF8F1;color:#24170F}
.cx-opts.all .cx-opt{font-size:1.45cqw;padding:.6cqw .8cqw}
.cx-opt .l{display:inline-grid;place-items:center;width:3cqw;height:3cqw;border-radius:.8cqw;background:var(--brand);color:#fff;font-size:1.7cqw;flex:none}
.cx-opts.all .cx-opt .l{width:2.2cqw;height:2.2cqw;font-size:1.15cqw}
.cx-meta{display:flex;align-items:center;gap:1cqw;font-size:1.6cqw;font-weight:700;color:#5E4B3F;border-top:1px solid #F0E3D6;padding-top:1.1cqw}
.cx-meta .tk{width:2.8cqw;height:2.8cqw;font-size:1.4cqw}
.cx-meta b{color:#24170F}
.cd{--p:1;width:7cqw;height:7cqw;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*360deg),rgba(0,0,0,.12) 0);display:grid;place-items:center;flex:none}
.cd span{width:5.4cqw;height:5.4cqw;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2.5cqw;font-weight:900;color:#24170F}
.cd.low{background:conic-gradient(#C0392B calc(var(--p)*360deg),rgba(0,0,0,.12) 0);animation:cdpulse .9s ease-in-out infinite}
@keyframes cdpulse{50%{transform:scale(1.07)}}
.cx-tab{display:grid;grid-template-columns:1fr 1fr;gap:.45cqw 1.8cqw;font-size:1.45cqw;font-weight:700;text-align:left;color:#3A2A20}
.cx-tab.one{grid-template-columns:1fr}
.cx-tab div{display:flex;gap:.8cqw;align-items:baseline}
.cx-tab b{display:inline-grid;place-items:center;min-width:2.8cqw;border-radius:.5cqw;padding:0 .45cqw;color:#fff;background:#8A7B70;font-size:1.25cqw}
.cx-tab .good b{background:#17714A}.cx-tab .warn b{background:#B86A00}.cx-tab .alert b{background:#A1302B}.cx-tab .info b{background:#0F5E85}
.cx-elig{display:flex;flex-wrap:wrap;gap:.9cqw;justify-content:center}
.cx-elig .chip{font-size:1.55cqw;background:#fff;border-color:#E6D4C2;color:#24170F;cursor:pointer}
.cx-join{display:flex;align-items:center;gap:3cqw}
.cx-joininfo{display:flex;flex-direction:column;align-items:flex-start;gap:.8cqw;text-align:left}
.cx-qr{background:#fff;padding:1.2cqw;border-radius:1.6cqw;box-shadow:0 1cqw 3cqw rgba(60,25,10,.2);width:26cqw;height:26cqw}
.cx-qr svg{width:100%;height:100%;display:block}
.cx-code{font-size:6cqw;font-weight:900;letter-spacing:.28em;color:#24170F;line-height:1}
.cx-url{font-size:1.3cqw;font-weight:700;color:#6E5A4C;word-break:break-all;max-width:30cqw}
.cx-here{font-size:2cqw;font-weight:800;color:#3A2A20}
.cx-here b{font-size:2.8cqw;color:var(--brand)}
.cx-pool{display:flex;flex-wrap:wrap;gap:.6cqw;justify-content:center;max-width:60cqw;max-height:9cqw;overflow:hidden}
.cx-pool .chip{font-size:1.3cqw;background:#fff;border-color:#E6D4C2;color:#3A2A20}
.cx-setup{font-size:1.45cqw;font-weight:700;color:#6E5A4C}
.cx-setup .linkbtn{font-size:1.45cqw}
.cx-actions{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center}
.cx-actions .btn{font-size:max(13px,1.55cqw);min-height:max(36px,4cqw);color:#24170F;background:#fff;border-color:#E2CDB9}
.cx-actions .btn.primary{color:#fff;background:linear-gradient(180deg,var(--brand-2),var(--brand))}
.cx-win{display:flex;align-items:center;gap:1.4cqw;font-size:4.2cqw;font-weight:900;color:var(--g)}
.cx-win .tk{width:6cqw;height:6cqw;font-size:2.8cqw}
.cx-podium{display:flex;align-items:flex-end;gap:2.4cqw;justify-content:center}
.cx-podium .pd{display:flex;flex-direction:column;align-items:center;gap:.7cqw}
.cx-podium .bar{width:13cqw;border-radius:1.2cqw 1.2cqw 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--g) 75%,#fff),var(--g));color:var(--gi);display:flex;justify-content:center;padding-top:1.2cqw;font-weight:900;font-size:3cqw;box-shadow:0 1cqw 2cqw rgba(0,0,0,.2);animation:rise 1s cubic-bezier(.2,.9,.3,1.1) both}
.cx-podium .pd:nth-child(2) .bar{animation-delay:.25s}.cx-podium .pd:nth-child(3) .bar{animation-delay:.45s}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.cx-podium .nm{font-size:1.8cqw;font-weight:900}
.cx-podium .tv{font-size:1.7cqw;font-weight:900;color:#5E4B3F}

/* ---------- tokens and effects ---------- */
.toks{position:absolute;inset:0;pointer-events:none;z-index:6}
.tok{position:absolute;left:0;top:0;width:4.4cqw;height:4.4cqw;margin:-2.2cqw 0 0 -2.2cqw;border-radius:50%;display:grid;place-items:center;color:var(--gi);font-weight:900;font-size:2.1cqw;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--g) 50%,#fff) 0%,var(--g) 48%,color-mix(in srgb,var(--g) 70%,#000) 100%);border:.38cqw solid #fff;box-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.45),0 .15cqw 0 rgba(0,0,0,.2);transition:transform .45s cubic-bezier(.3,.8,.3,1.2);will-change:transform}
.tok span{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.tok.instant,.tok.moving{transition:none}
.tok.moving{z-index:9;box-shadow:0 1.4cqw 2.2cqw rgba(0,0,0,.45)}
.tok.active{z-index:8}
.tok.active::after{content:"";position:absolute;inset:-1cqw;border-radius:50%;border:.4cqw solid var(--g);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.75);opacity:1}to{transform:scale(1.65);opacity:0}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:10}
.pop{position:absolute;transform:translate(-50%,-50%);background:var(--g,#17714A);color:var(--gi,#fff);font-weight:900;font-size:1.9cqw;padding:.4cqw 1.1cqw;border-radius:99px;border:.2cqw solid #fff;box-shadow:0 .5cqw 1.2cqw rgba(0,0,0,.35);animation:popup 1.75s ease-out forwards;white-space:nowrap}
.pop.gain{background:#17714A;color:#fff}
.pop.up{background:linear-gradient(90deg,#F2A900,#E2650F);color:#fff}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}14%{opacity:1;transform:translate(-50%,-90%) scale(1.12)}70%{opacity:1;transform:translate(-50%,-170%) scale(1)}100%{opacity:0;transform:translate(-50%,-230%) scale(.95)}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70}

/* dice */
.dice{display:flex;gap:1.6cqw;justify-content:center}
.die{width:7.4cqw;height:7.4cqw;border-radius:1.4cqw;background:#fff;border:1px solid #e3d6ca;box-shadow:0 .4cqw 1cqw rgba(0,0,0,.18);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:1cqw;gap:.25cqw}
.die i{border-radius:50%;place-self:center;width:1.3cqw;height:1.3cqw}
.die i.on{background:#2b1d16}
.die.roll{animation:tumble .7s cubic-bezier(.2,.8,.3,1)}
@keyframes tumble{0%{transform:translateY(-3cqw) rotate(-200deg) scale(.6);opacity:.2}60%{transform:translateY(.6cqw) rotate(15deg) scale(1.05);opacity:1}100%{transform:none}}
.dice.sm .die{width:4.2cqw;height:4.2cqw;padding:.6cqw;border-radius:.8cqw}
.dice.sm .die i{width:.75cqw;height:.75cqw}
.dice.sm{gap:.8cqw}
.dice3d{display:flex;gap:3.4cqw;justify-content:center;perspective:70cqw;padding:1.4cqw 0 .6cqw}
.cube-wrap{width:9.5cqw;height:9.5cqw;animation:dicebounce 1.05s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--d)}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--fx)) rotateY(var(--fy));animation:roll3d 1.05s cubic-bezier(.15,.75,.25,1) both;animation-delay:var(--d)}
@keyframes roll3d{from{transform:rotateX(calc(var(--fx) + var(--sx))) rotateY(calc(var(--fy) + var(--sy))) rotateZ(120deg)}to{transform:rotateX(var(--fx)) rotateY(var(--fy)) rotateZ(0deg)}}
@keyframes dicebounce{0%{transform:translateY(-9cqw) scale(.7);opacity:0}40%{transform:translateY(1cqw) scale(1.04);opacity:1}62%{transform:translateY(-1.4cqw)}80%{transform:translateY(.35cqw)}100%{transform:none}}
.fc{position:absolute;inset:0;background:linear-gradient(145deg,#FFFFFF,#F0E6DC);border-radius:1.7cqw;box-shadow:inset 0 0 0 .2cqw #E1D3C5,inset 0 -.6cqw 1cqw rgba(0,0,0,.07);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:1.35cqw;backface-visibility:hidden}
.fc i{width:1.65cqw;height:1.65cqw;border-radius:50%;place-self:center}
.fc i.on{background:radial-gradient(circle at 35% 35%,#6a4634,#1d110b)}
.f1{transform:translateZ(4.75cqw)}.f6{transform:rotateY(180deg) translateZ(4.75cqw)}.f3{transform:rotateY(90deg) translateZ(4.75cqw)}.f4{transform:rotateY(-90deg) translateZ(4.75cqw)}.f2{transform:rotateX(90deg) translateZ(4.75cqw)}.f5{transform:rotateX(-90deg) translateZ(4.75cqw)}

/* ---------- banner ---------- */
.banner{position:fixed;left:0;right:0;top:64px;z-index:45;display:flex;justify-content:center;pointer-events:none;transform:translateY(-130%);opacity:0;transition:transform .5s cubic-bezier(.2,1.1,.3,1),opacity .35s}
.banner.show{transform:none;opacity:1}
.banner .bn{display:flex;align-items:center;gap:22px;padding:14px 44px 18px;background:var(--g);color:var(--gi);border-radius:0 0 28px 28px;box-shadow:0 18px 44px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.25);min-width:min(760px,92vw)}
.bn b{display:block;font-size:clamp(28px,3.5vw,60px);font-weight:900;line-height:1.02;text-transform:uppercase;letter-spacing:.02em}
.bn small{display:block;font-size:clamp(15px,1.45vw,25px);font-weight:700;opacity:.94;margin-top:4px}
.bn-tag{width:clamp(50px,4.6vw,84px);height:clamp(50px,4.6vw,84px);border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:clamp(24px,2.5vw,44px);font-weight:900;border:3px solid rgba(255,255,255,.75);flex:none}

/* ---------- team panels ---------- */
.teams{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,18px);justify-content:safe center;min-width:0;height:100%;max-height:100%;overflow-y:auto;scrollbar-width:none;container-type:inline-size;padding:6px 12px;margin:0 -8px}
.teams::-webkit-scrollbar{display:none}
.teams.many{display:grid;grid-template-columns:1fr 1fr;align-content:safe center;gap:10px}
.teams.many .tcard{border-radius:14px}
.teams.many .tm{display:none}
.teams.many .tc-head{font-size:clamp(13px,.95vw,18px);padding:7px 10px;gap:7px}
.teams.many .tc-trv{padding:7px 10px 2px}
.teams.many .tc-trv b{font-size:clamp(20px,1.7vw,32px)}
.teams.many .tc-grid{grid-template-columns:1fr 1fr;padding:2px 10px 6px}
.teams.many .tc-grid span:nth-child(3){display:none}
.teams.many .tc-grid b{font-size:clamp(13px,.95vw,17px)}
.teams.many .tc-lead{padding:0 10px 8px;font-size:clamp(11px,.8vw,14px)}
.teams.many .tc-badges{padding:0 10px 8px}
.teams.many .tc-now{padding:2px 10px;font-size:11px}
.teams.many .tcard.lobby .tc-ms{padding:6px 10px 8px;font-size:clamp(12px,.85vw,15px)}
.tcard{background:var(--st-panel);border:1px solid var(--st-line);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),box-shadow .35s;color:var(--st-ink)}
.tcard.active{transform:scale(1.035);box-shadow:0 0 0 3px var(--g),0 0 36px color-mix(in srgb,var(--g) 55%,transparent)}
:root[data-theme="light"] .tcard{box-shadow:0 4px 12px rgba(70,35,10,.10)}
:root[data-theme="light"] .tcard.active{box-shadow:0 0 0 3px var(--g),0 0 22px color-mix(in srgb,var(--g) 40%,transparent)}
.tc-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--g);color:var(--gi);font-size:clamp(15px,1.3vw,25px);font-weight:900}
.tc-head b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-tag{display:inline-grid;place-items:center;width:1.75em;height:1.75em;border-radius:50%;background:rgba(255,255,255,.25);font-size:.85em;flex:none;border:2px solid rgba(255,255,255,.6)}
.tc-rank{font-size:.75em;background:rgba(0,0,0,.18);border-radius:99px;padding:1px 9px}
.tc-n{font-size:.7em;opacity:.9}
.tc-now{background:color-mix(in srgb,var(--g) 22%,transparent);color:var(--st-ink);font-weight:900;font-size:clamp(12px,.9vw,16px);letter-spacing:.08em;text-transform:uppercase;padding:4px 14px;animation:blink 1.4s ease-in-out infinite}
.tc-trv{display:flex;align-items:baseline;gap:10px;padding:10px 14px 4px}
.tc-trv small{font-size:clamp(11px,.8vw,14px);font-weight:900;letter-spacing:.1em;color:var(--st-muted)}
.tc-trv b{font-size:clamp(26px,2.5vw,48px);font-weight:900;line-height:1}
.tc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 14px 8px}
.tc-grid span{display:flex;flex-direction:column}
.tc-grid i{font-style:normal;font-size:clamp(10px,.72vw,13px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--st-muted)}
.tc-grid b{font-size:clamp(15px,1.15vw,22px);font-weight:900}
.tc-tiers{display:flex;gap:4px}
.tc-tiers em{font-style:normal;text-align:center;border-radius:6px;padding:1px 6px;font-size:.72em;color:#fff;letter-spacing:-.02em;white-space:nowrap}
.tc-tiers .t0{background:#8A6A4A}.tc-tiers .t1{background:#0F6E8C}.tc-tiers .t2{background:#8F1D2C}
.tc-lead{padding:0 14px 10px;font-size:clamp(13px,.95vw,17px);font-weight:700;color:var(--st-muted)}
.tc-lead b{color:var(--st-ink)}
.tc-badges{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.tcard.lobby .tc-ms{list-style:none;margin:0;padding:8px 14px 12px;display:flex;flex-direction:column;gap:4px;font-size:clamp(14px,1vw,19px);font-weight:700}
.tcard.lobby .tc-ms li{display:flex;align-items:center;gap:8px}
.tcard.lobby .tc-ms .muted{color:var(--st-muted);font-weight:600}
@container (max-width:250px){.tc-grid{grid-template-columns:1fr 1fr}.tc-grid span:nth-child(3){display:none}.tc-badges{display:none}
  .tc-head{font-size:14px;padding:8px 10px;gap:6px}.tc-rank{padding:1px 6px}.tc-tag{width:1.6em;height:1.6em;border-width:1.5px}
  .tc-trv,.tc-grid{padding-left:10px;padding-right:10px}.tc-lead{padding:0 10px 9px}}

/* ---------- overlays ---------- */
.ovl{position:relative;z-index:60}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(14,6,3,.62);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;color:var(--ink)}
.overlay .panel{position:relative;width:min(560px,100%);gap:14px}
.overlay .panel.wide{width:min(1080px,100%)}
.overlay .panel h3{font-size:22px;padding-right:40px}
.ov-x{position:absolute;top:12px;right:12px;border-color:var(--line) !important;background:var(--surface-2) !important;color:var(--ink) !important}
.ov-foot{display:flex;justify-content:flex-end;gap:10px}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.settings .input{min-height:42px;padding:7px 10px}
.ask{display:flex;gap:14px;flex-wrap:wrap}
.ask .field{min-width:200px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mteam{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2)}
.mt-head{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--g);color:var(--gi)}
.mt-head .input{min-height:34px;padding:4px 8px;font-weight:800;background:rgba(255,255,255,.92);color:#24170F;border-color:transparent}
.mteam ul{list-style:none;margin:0;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.mteam li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.mteam .mn{flex:1;min-width:0}
.mteam .mn small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.mini-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px;font-weight:800;padding:3px 8px;border-radius:7px}
.mini-sel{border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:12px;font-weight:700;padding:3px 4px;max-width:110px}
.mpool{border:1.5px dashed var(--brand);border-radius:14px;padding:10px 12px;margin:0 0 12px;background:color-mix(in srgb,var(--brand) 6%,transparent)}
.mpool > b{font-size:14px;color:var(--brand)}
.mpool ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px}
.mpool li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.mpool .mn{flex:1;min-width:0}
.mhint{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px;font-weight:700;color:var(--muted)}
.mhint svg{width:18px;height:18px;flex:none}
.overlay.present{background:radial-gradient(1200px 800px at 50% 40%,#3B1810,#120704);align-items:center}
.slide{position:relative;width:min(1180px,96vw);min-height:min(78vh,760px);background:linear-gradient(160deg,#FFFAF4,#F3E2D0);color:#24170F;border-radius:28px;padding:clamp(28px,4vw,64px);display:flex;flex-direction:column;gap:clamp(12px,1.8vh,22px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.slide .ov-x{background:#fff !important;border-color:#E6D4C2 !important;color:#24170F !important}
.sl-n{font-size:clamp(14px,1.2vw,20px);font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.sl-ic{font-size:clamp(56px,6vw,104px);line-height:1}
.slide h2{font-size:clamp(38px,4.6vw,80px);font-weight:900;color:var(--maroon)}
.slide ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:clamp(8px,1.4vh,18px);font-size:clamp(20px,2.2vw,38px);font-weight:700;line-height:1.3;flex:1}
.slide ul li::marker{color:var(--brand)}
.sl-nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
.sl-nav .btn{min-height:52px;font-size:18px;padding:10px 22px;color:#24170F;background:#fff;border-color:#E2CDB9}
.sl-nav .btn.primary{color:#fff;background:linear-gradient(180deg,var(--brand-2),var(--brand))}
.dots{display:flex;gap:10px}
.dots button{width:14px;height:14px;border-radius:50%;border:0;background:#E2CDB9;padding:0}
.dots button.on{background:var(--brand);transform:scale(1.25)}
.slide .note{color:#7A6A5E}
.overlay.side{justify-content:flex-end;align-items:stretch;padding:0}
.drawer{width:min(480px,100%);height:100%;border-radius:0 !important;overflow:auto}
.drawer .log{display:flex;flex-direction:column}
.drawer .log div{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--line-2);font-size:14.5px}
.drawer .log em{font-style:normal;font-weight:900;color:var(--brand);font-size:12px}
.drawer .tk{width:22px;height:22px;font-size:11px;margin-top:1px}
.joinp{align-items:center;text-align:center;width:min(520px,100%) !important}
.joinp .cx-qr.big{width:min(360px,70vw);height:min(360px,70vw);padding:14px;border-radius:18px}
.joinp .cx-code{font-size:48px;color:var(--ink)}
.joinp .cx-url{font-size:13px;max-width:100%;color:var(--muted)}
.keytab{width:100%;border-collapse:collapse;font-size:14px}
.keytab th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px}
.keytab td{border-top:1px solid var(--line-2);padding:8px 6px;vertical-align:top}
.keytab small{color:var(--muted)}
.overlay.pop-ov{justify-content:flex-end;align-items:flex-start;padding:74px 16px 0}
.soundp{width:min(360px,100%) !important}
.soundp input[type=range]{width:100%;accent-color:var(--brand)}

/* ---------- demo dock ---------- */
.dock{display:flex;flex-direction:column;gap:10px;min-width:0;align-self:center}
.dock-ctl{display:flex;flex-direction:column;gap:8px;background:var(--st-panel);border:1px solid var(--st-line);color:var(--st-ink);border-radius:var(--r);padding:10px 12px}
.dock-ctl .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dock-ctl select{border:1px solid var(--st-line);background:var(--st-panel-2);color:var(--st-ink);border-radius:8px;padding:6px 8px;font-weight:800;flex:1;min-width:0}
.dock-ctl select option{color:#24170F}
.dock-ctl .note{color:var(--st-muted)}
.dock-ctl .switch{font-size:13px}

/* ================= PHONE ================= */
.phone{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative;color:var(--ink)}
.phone.framed{height:min(800px,calc(100dvh - 150px));min-height:520px;border:10px solid #120a07;border-radius:36px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.ph-head{flex:none;display:flex;align-items:center;gap:9px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
.phone.teamed .ph-head{background:var(--tc);color:var(--tci);border-bottom-color:transparent}
.phone.teamed .ph-head .tk{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.phone.teamed .ph-head .chip{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:inherit}
.ph-head .who{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.ph-head .who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-head .who small{font-size:12px;font-weight:700;opacity:.85}
.ph-head .sp{flex:1}
.hbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid rgba(127,127,127,.3);background:rgba(255,255,255,.14);color:inherit;padding:0;flex:none}
.ph-main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px max(14px,env(safe-area-inset-right)) 18px max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.ph-main > *{flex-shrink:0}
.ph-tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 18px rgba(0,0,0,.06);z-index:5}
.ph-tabs button{border:0;background:transparent;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:800;color:var(--muted);position:relative}
.ph-tabs button .i{font-size:20px;line-height:1.2}
.ph-tabs button.on{color:var(--tc,var(--brand))}
.ph-tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--tc,var(--brand))}
.ph-tabs button .pip{position:absolute;top:4px;right:calc(50% - 20px);background:var(--brand);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.ph-flash{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:var(--g);color:var(--gi);pointer-events:none;opacity:0;visibility:hidden}
.ph-flash.show{visibility:visible;animation:flash 1.9s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scale(1.06)}10%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
.ph-flash > div{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px}
.ph-flash b{font-size:32px;font-weight:900;line-height:1.1}
.ph-flash small{font-size:17px;font-weight:700;opacity:.92}
.fl-tag{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:900;background:rgba(255,255,255,.2);border:4px solid rgba(255,255,255,.7);animation:pop .5s cubic-bezier(.2,1.4,.3,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
.ph-sheet{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.ph-sheet.show{display:flex}
.sh-in{background:var(--bg);width:100%;max-height:90%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:sheetup .3s ease-out}
@keyframes sheetup{from{transform:translateY(40%)}to{transform:none}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:18px}
.sh-body{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.pcard.tight{padding:10px 12px;gap:6px}
.pcard.join{gap:14px}
.pcard.turn.mine{border:2px solid var(--g);background:color-mix(in srgb,var(--g) 8%,var(--surface))}
.ph-turn{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}
.ph-turn .tk{width:32px;height:32px;font-size:15px}
.rollbtn{min-height:78px;font-size:24px;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025);box-shadow:0 8px 26px rgba(226,101,15,.45)}}
.teamcard{padding:0;overflow:hidden;gap:0}
.tm-top{display:flex;align-items:center;gap:12px;padding:14px;background:var(--g);color:var(--gi)}
.tm-top small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.tm-top b{font-size:22px;font-weight:900}
.tm-top .tk.big{width:46px;height:46px;font-size:22px}
.tm-list{list-style:none;margin:0;padding:12px 14px 4px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.tm-list small{color:var(--muted);font-weight:700}
.teamcard > .field,.teamcard > .btn,.teamcard > .ph-stats,.teamcard > .note{margin:8px 14px}
.teamcard > .btn{margin-bottom:14px}
.tm-trv{padding:14px;font-size:30px;font-weight:900}
.tm-trv small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.ph-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ph-stats b{display:block;font-size:18px;font-weight:900}
.ph-stats small{font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.qcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.qcard.mine{border:2px solid var(--g)}
.qcard .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--band);color:#fff}
.qcard .hd.lt{color:#2b1d00}
.qcard .hd .ic{font-size:28px}
.qcard .hd b{font-size:16px;display:block;line-height:1.15}
.qcard .hd small{font-size:12px;font-weight:700;opacity:.92}
.qcard .bd{padding:12px;display:flex;flex-direction:column;gap:10px}
.qprob{font-size:17.5px;font-weight:700;line-height:1.35}
.qq{font-size:14px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface-2);font-weight:800;font-size:15.5px;min-height:54px}
.opt .l{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;flex:none}
.opt .oi{font-size:24px}
.opt .nm{flex:1}
.opt .v{font-size:12px;font-weight:800;color:var(--muted);text-align:right;max-width:42%}
.opt.mine{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 11%,var(--surface))}
.opt.lead{box-shadow:inset 0 0 0 2px var(--maroon)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.all{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opts.all .opt{gap:7px;padding:7px 8px;font-size:13.5px;min-height:48px}
.opts.all .opt .l{width:22px;height:22px;font-size:12px}
.opts.all .opt .v{display:none}
.ph-cd{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted);font-size:14px}
.ph-cd .cd{width:42px;height:42px;background:conic-gradient(var(--brand) calc(var(--p)*360deg),var(--line) 0)}
.ph-cd .cd span{width:33px;height:33px;font-size:14px;background:var(--surface);color:var(--ink)}
.ph-cd .cd.low{background:conic-gradient(#C0392B calc(var(--p)*360deg),var(--line) 0)}
.res{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:1.5px solid transparent}
.res.good{background:var(--good-bg);color:var(--good)}
.res.warn{background:var(--warn-bg);color:var(--warn)}
.res.info{background:var(--info-bg);color:var(--info)}
.res.alert{background:var(--alert-bg);color:var(--alert)}
.res.pay{background:color-mix(in srgb,var(--g) 12%,var(--surface));border-color:var(--g);color:var(--ink)}
.res b{font-size:17px}
.res span{color:var(--ink);font-size:14.5px;font-weight:600}
.res .chips{font-size:13px;font-weight:800}
.lt-head{font-size:12.5px;font-weight:800;letter-spacing:.05em;display:flex;align-items:center;gap:8px;color:var(--muted)}
.ph-dice{display:flex;justify-content:center;container-type:inline-size}
.ph-dice .dice{gap:18px}
.ph-dice .die{width:66px;height:66px;padding:9px;border-radius:13px;gap:2px}
.ph-dice .die i{width:11px;height:11px}
.center-txt{text-align:center;font-weight:700}
.pf-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.pf-row:first-child{border-top:0}
.pf-row .ic{font-size:24px;text-align:center}
.pf-row b{font-size:15px;display:block;line-height:1.2}
.pf-row small{font-size:12.5px;color:var(--muted);font-weight:700}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));border-radius:4px}
.upbanner{display:flex;align-items:center;gap:10px;background:var(--good-bg);color:var(--good);border-radius:14px;padding:10px 12px;font-weight:800;border:1.5px solid color-mix(in srgb,var(--good) 35%,transparent)}
.upbanner span{flex:1;color:var(--ink);font-size:14px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800}
.filters button.on{background:var(--tc,var(--brand));border-color:var(--tc,var(--brand));color:var(--tci,#fff)}
.ccard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.ccard .hd{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--band,var(--maroon));color:#fff}
.ccard .hd.lt{color:#2b1d00}
.ccard.act .hd{background:linear-gradient(120deg,var(--maroon),#5E1220)}
.ccard .hd .ic{font-size:22px}
.ccard .hd b{flex:1;font-size:15px;line-height:1.15}
.ccard .bd{padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.own-line{background:var(--g);color:var(--gi);border-radius:8px;padding:5px 9px;font-weight:800;font-size:13px}
.ttab{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
.ttab th,.ttab td{border:1px solid var(--line);padding:4px 6px}
.ttab th{font-weight:800;background:var(--surface-2)}
.ttab .cur{background:color-mix(in srgb,var(--brand) 16%,var(--surface));font-weight:900}
.ttab.stat td{text-align:center}
.sol{border-radius:10px;padding:8px 10px;background:var(--good-bg);color:var(--good);font-size:13.5px;font-weight:800}
.sol span{color:var(--ink);font-weight:600}
.sol.pend{background:var(--surface-2);color:var(--muted)}
.otab{width:100%;border-collapse:collapse;font-size:13px}
.otab td{border-top:1px solid var(--line-2);padding:5px 6px;vertical-align:top}
.otab td:first-child{font-weight:900;width:34px;text-align:center}
.otab tr.good td:first-child{color:var(--good)}.otab tr.warn td:first-child{color:var(--warn)}.otab tr.alert td:first-child{color:var(--alert)}
.otab b{display:block}
.rule{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);scroll-margin:80px}
.rule.now{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 28%,transparent)}
.r-ic{font-size:28px;line-height:1.2}
.rule h4{display:flex;align-items:center;gap:8px;font-size:16.5px;flex-wrap:wrap}
.r-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px}
.r-now{margin-left:auto;font-size:11px;background:var(--brand);color:#fff;border-radius:99px;padding:2px 8px;letter-spacing:.04em}
.rule ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:3px}
.gpick{display:flex;flex-direction:column;gap:8px}
.gpick button{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:12px;text-align:left;font-weight:800;border-left:8px solid var(--g)}
.gpick button.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 10%,var(--surface));box-shadow:0 0 0 2px var(--g)}
.gpick button small{display:block;font-weight:700;color:var(--muted);font-size:12.5px}
.gpick button[disabled]{opacity:.45}
.lbp .row{display:grid;grid-template-columns:20px 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.lbp .row:first-child{border-top:0}
.lbp .row b{font-size:15px}
.lbp .row small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.lbp .row .v{text-align:right;font-weight:900;font-size:17px}
.lbp .row .v small{font-size:10px;letter-spacing:.08em}
.lbp .row.me{background:color-mix(in srgb,var(--tc,var(--brand)) 9%,transparent);border-radius:10px}
.lb-rk{font-weight:900;color:var(--muted);text-align:center}
details summary{cursor:pointer;font-weight:800}

/* mini board on phones */
.miniboard{gap:.45cqw;padding:.7cqw;border-radius:3cqw;height:auto;aspect-ratio:1/1;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.miniboard .cell{padding:.3cqw .2cqw 2.8cqw;border-radius:1.2cqw}
.miniboard .cell .t-nm,.miniboard .cell .t-sub{display:none}
.miniboard .cell .t-ic{font-size:5.2cqw;margin-top:.6cqw}
.miniboard .cell.s-left,.miniboard .cell.s-right{flex-direction:column;align-items:center;justify-content:flex-start;padding:.3cqw .2cqw 2.8cqw}
.miniboard .cell.corner .t-ic{font-size:7cqw}
.miniboard .t-lb{left:.4cqw;right:.4cqw;bottom:.4cqw;height:2.2cqw;border-radius:.8cqw}
.miniboard .t-lb b,.miniboard .t-lb .t-st,.miniboard .t-hold{display:none}
.miniboard .t-tag{width:auto;height:auto;background:none;font-size:1.9cqw}
.miniboard .cell.k-mkt .t-sub{display:none}
.miniboard .cell.sel{outline:.8cqw solid var(--tc,var(--brand));outline-offset:-.4cqw;z-index:2}
.miniboard .ptok{position:absolute;top:.5cqw;left:.5cqw;right:.5cqw;display:flex;flex-wrap:wrap;gap:.3cqw;justify-content:center}
.miniboard .ptok span{width:4.6cqw;height:4.6cqw;border-radius:50%;background:var(--g);color:var(--gi);font-size:2.4cqw;font-weight:900;display:grid;place-items:center;border:.5cqw solid #fff;box-shadow:0 .4cqw .8cqw rgba(0,0,0,.4)}
.miniboard .center{padding:3cqw;gap:1cqw}
.miniboard .center .cx-word{font-size:9cqw}
.miniboard .center .cx-sub{font-size:3.4cqw}

@media (prefers-reduced-motion:reduce){
  .tok{transition:none}.die.roll,.cube,.cube-wrap{animation:none}.tok.active::after,.board.has-turn,.rollbtn,.cell.upready .t-lb,.cell.land{animation:none}
}

/* focus mode: compact scores beside the board */
.focus-scores{display:none}
.disp[data-focus="1"] .focus-scores{display:flex;position:absolute;left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);flex-direction:column;gap:10px;z-index:5;max-width:calc((100vw - var(--bsz)) / 2 - 24px)}
.disp[data-focus="1"] .stage.demo ~ .focus-scores{display:none}
.fs{display:flex;align-items:center;gap:10px;background:var(--g);color:var(--gi);border-radius:16px;padding:8px 14px 8px 8px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.3);min-width:0}
.fs i{font-style:normal;display:inline-grid;place-items:center;width:clamp(26px,2.4vw,40px);height:clamp(26px,2.4vw,40px);border-radius:50%;background:rgba(255,255,255,.25);font-size:clamp(13px,1.1vw,18px);flex:none}
.fs b{font-size:clamp(16px,1.6vw,30px);line-height:1}
.fs small{display:block;font-size:clamp(10px,.75vw,13px);font-weight:800;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs.active{box-shadow:0 0 0 3px #fff,0 0 26px var(--g)}
@media (max-aspect-ratio:1/1){.disp[data-focus="1"] .focus-scores{position:static;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center;max-width:none;padding:8px}}

function rc(p){

}

const SPEED = (() => { try { return Math.max(1, +new URLSearchParams(location.search).get('speed') || 1); } catch(e){ return 1; } })();

function setHTML(el, html){ if (!el) return false; if (el._h !== html){ el.innerHTML = html; el._h = html; return true; } return false; }
const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const die = () => 1 + rnd(6);
const shuffle = arr => { const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = rnd(i+1); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const uid = (n=10) => { const al='abcdefghijkmnpqrstuvwxyz23456789'; let s=''; for (let i=0;i<n;i++) s += al[rnd(al.length)]; return s; };
const CODE_AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const newCode = () => { let s=''; for (let i=0;i<4;i++) s += CODE_AL[rnd(CODE_AL.length)]; return s; };
const store = {
