          <b>${esc(NEED_TXT[ev.need])}</b>
          <div class="opts">${ev.elig.map(p => { const sp = SPACES[p], c = S.clients[p]; return `<button class="opt" data-act="choose" data-p="${p}" ${mine && leader && !pend ? '' : 'disabled'}><span class="oi">${sp.icon}</span><span class="nm">${esc(sp.short)}<br><small class="muted">${STARS[c.t]} ${TIERS[c.t]} · TRV ${rupee(sp.trv[c.t])}</small></span></button>`; }).join('')}</div>
          ${mine && !leader ? `<div class="wait"><span class="spin"></span>${esc(ld)} picks the client</div>` : ''}${!mine ? `<div class="wait"><span class="spin"></span>${esc(tg.name)} is choosing</div>` : ''}</div>`;
        break;
      }
    }
    h += this.statsHTML(S, g);
    return h;
  }
  isNext(S, g){ const t = S.turn; let i = t.gi; for (let k=0;k<S.groups.length;k++){ i = (i+1) % S.groups.length; const x = S.groups[i]; if (x.skip && x.id !== g.id) continue; return x.id === g.id; } return false; }
  questionHTML(S, t, tg, mine, leader, pend){
    const q = t.q, sp = SPACES[q.p], mk = MK[sp.mk], cid = this.ctx.cid;
    const votes = Object.assign({}, q.votes); if (this.optim && this.optim.seq === t.seq) votes[cid] = this.optim.k;
    const myV = votes[cid], leadV = tg.leader ? votes[tg.leader] : null;
    const tally = {}; for (const [c,k] of Object.entries(votes)) (tally[k] = tally[k] || []).push(S.members[c] ? firstName(S.members[c].n) : '');
    const all = q.opts.length > 4;
    const opts = q.opts.map((k,i) => {
      const who = tally[k] || [];
      const cls = 'opt' + (mine && myV === k ? ' mine' : '') + (mine && leadV === k ? ' lead' : '');
      return `<button class="${cls}" data-act="vote" data-k="${k}" ${mine && !pend ? '' : 'disabled'}><span class="l">${LET[i]}</span><span class="nm">${esc(prodShort(k))}</span>${mine && who.length ? `<span class="v">${who.length} · ${esc(who.join(', '))}</span>` : ''}</button>`;
    }).join('');
    const tip = mine ? (leader ? (q.dl ? 'Lock before the clock runs out. Otherwise the top suggestion locks.' : 'Discuss, then lock your answer.') : 'Tap to suggest an answer. Your leader locks it.') : esc(tg.name) + ' is answering';
    return `<div class="qcard${mine ? ' mine' : ''}" style="--band:${mk.color};--g:${tg.color};--gi:${tg.ink}"><div class="hd${mk.light?' lt':''}"><span class="ic">${sp.icon}</span><div><b>${esc(sp.name)}</b><small>${esc(mk.name)} · TRV ${rupee(sp.trv[0])}</small></div></div>
      <div class="bd"><p class="qprob">${esc(sp.prob)}</p><b class="qq">Which product fits best?</b>
      <div class="opts${all?' all':''}">${opts}</div><div class="ph-cd">${q.dl ? this.cdHTML(q.dl, S.settings.timer*1000) : ''}<span>${tip}</span></div>
      ${mine && leader ? `<button class="btn primary big" data-act="lock" ${leadV && !pend ? '' : 'disabled'}>${pend ? 'Locking…' : leadV ? 'Lock answer: ' + esc(prodShort(leadV)) : 'Tap an option, then lock it'}</button>` : ''}
      </div></div>`;
  }
  lastHTML(S){
    const li = lastInfo(S, S.last); if (!li) return '';
    return `<div class="pcard tight"><div class="lt-head">${tokHTML(li.g)} LAST TURN · ${esc(li.g ? li.g.name : '')}${li.n ? ' rolled ' + li.n : ''}</div>
      <div class="res ${li.tone}"${li.g ? ` style="--g:${li.g.color};--gi:${li.g.ink}"` : ''}><b>${li.icon} ${esc(li.big)}</b><span>${esc(li.why)}</span>${li.chips.length ? `<span class="chips">${li.chips.map(esc).join(' · ')}</span>` : ''}</div></div>`;
  }
  statsHTML(S, g){
    const trv = trvOf(S, g.id), n = Object.values(S.clients).filter(c => c.o === g.id).length, sp = SPACES[g.pos];
    const nx = S.settings.rotate ? nextLeaderOf(S, g) : null;
    let b = '';
    if (g.rate > 0) b += '<span class="badge up">Fees +₹50 until Start</span> ';
    if (g.rate < 0) b += '<span class="badge dn">Fees −₹50 until Start</span> ';
    if (g.skip) b += '<span class="badge hold">Sits out next turn</span> ';
    return `<div class="ph-stats"><div><small>TRV</small><b>${rupee(trv)}</b></div><div><small>Cash</small><b>${rupee(g.cash)}</b></div><div><small>Clients</small><b>${n}</b></div></div>
      <div class="note">★ ${esc(firstName(leaderName(S, g)))} leads this round${nx && S.members[nx] ? ` · next: ${esc(firstName(S.members[nx].n))}` : ''} · token on ${sp.icon} ${esc(sp.short)} ${b}</div>`;
  }
  upgradesHTML(S, g, leader){
    return Object.entries(S.clients).filter(([,c]) => c.o === g.id && canUp(c)).map(([p,c]) => {
      const cost = S.settings.fee[c.t] || 0, sp = SPACES[p];
      return `<div class="upbanner">⬆️<span><b>${esc(sp.short)}</b> is ready for ${TIERS[c.t+1]}${cost ? ' · ' + rupee(cost) : ''}. TRV ${rupee(sp.trv[c.t])} → ${rupee(sp.trv[c.t+1])}</span>${leader ? `<button class="btn sm primary" data-act="up" data-p="${p}" ${g.cash < cost ? 'disabled' : ''}>Upgrade</button>` : '<small>Leader confirms</small>'}</div>`;
    }).join('');
  }
  /* ---------- Portfolio ---------- */
  portHTML(S, g, leader){
    const own = Object.entries(S.clients).filter(([,c]) => c.o === g.id).sort((a,b) => b[1].t - a[1].t || SPACES[b[0]].trv[b[1].t] - SPACES[a[0]].trv[a[1].t]);
    let h = this.upgradesHTML(S, g, leader);
    h += `<div class="pcard teamcard" style="--g:${g.color};--gi:${g.ink}"><div class="tm-top"><span class="tk big">${esc(g.tag)}</span><div><small>Portfolio</small><b>${esc(g.name)}</b></div></div>${S.phase !== 'lobby' ? this.statsHTML(S, g) : ''}
      <div class="note">Visit fees earned ${rupee(g.stats ? g.stats.visitGot : 0)} · paid ${rupee(g.stats ? g.stats.visitPaid : 0)} · right answers ${g.stats ? g.stats.ok : 0} of ${g.stats ? g.stats.q : 0}</div></div>`;
    if (!own.length) return h + `<div class="pcard"><b>Your first relationship is one right answer away</b><span class="muted">Land on an open client, read the business need and pick the product that fits. A right answer wins the client at Affluent.</span></div>`;
    h += `<div class="pcard">${own.map(([p,c]) => {
      const sp = SPACES[p]; const fee = feeFor(S, g, +p); const nt = c.t + 1;
      const prog = nt <= 2 ? `<div class="bar"><i style="width:${Math.min(100, 100*c.e/TH[nt])}%"></i></div><small>${rupee(c.e)} of ${rupee(TH[nt])} collected toward ${TIERS[nt]}</small>` : '<small>Top tier reached</small>';
      const btn = canUp(c) && leader ? `<button class="btn sm primary" data-act="up" data-p="${p}">Upgrade</button>` : canUp(c) ? '<span class="badge info">Ready</span>' : '';
      return `<div class="pf-row"><span class="ic">${sp.icon}</span><div><b>${esc(sp.name)}</b><small>${STARS[c.t]} ${TIERS[c.t]} · ${rupee(fee)} per pass · TRV ${rupee(sp.trv[c.t])} · visit fee ${rupee((S.settings.visit || [50,100,200])[c.t])}${c.s ? ' · ⏸ on hold until next Start' : ''}</small>${prog}</div>${btn}</div>`;
    }).join('')}</div>`;
    h += `<div class="note">Each time your token passes or lands on a client you hold, you collect its fee. Fees build toward the next tier: ${rupee(TH[1])} for Wealth, ${rupee(TH[2])} for Private. Other teams pay you a visit fee when they land on your clients.</div>`;
    return h;
  }
  /* ---------- Board ---------- */
  renderBoard(S, g){
    if (this.kind !== 'board'){
      this.main.innerHTML = `<div class="board miniboard"><div class="center"><div class="cx-word">PORT<b>FOLIO</b></div><div class="cx-sub mb-round"></div></div></div><div class="mb-legend note"></div><div class="mb-detail"></div>`;
      this.main._h = null; this.mini = $('.miniboard', this.main); boardCellsInit(this.mini); this.kind = 'board';
    }
    const tokBy = {}; S.groups.forEach(x => (tokBy[x.pos] = tokBy[x.pos] || []).push(x));
    for (let p=0;p<32;p++) this.mini._cells[p]._extra = tokBy[p] ? `<div class="ptok">${tokBy[p].map(x => `<span style="--g:${x.color};--gi:${x.ink}">${esc(x.tag)}</span>`).join('')}</div>` : '';
    const sel = this.sel ?? g.pos;
    const ex = {}; ex[sel] = 'sel';
    paintCells(this.mini, S, ex);
    setHTML($('.mb-round', this.main), S.turn ? `Round ${S.turn.round} of ${S.settings.rounds}` : '');
    setHTML($('.mb-legend', this.main), `Tap any space to read its card. ${S.groups.map(x => `${tokHTML(x)} ${esc(x.name)}`).join(' &nbsp; ')}`);
    morph($('.mb-detail', this.main), cardTile(S, sel));
  }
  /* ---------- Cards ---------- */
  cardsHTML(S, g){
    const f = this.filter;
    const list = SPACES.filter(sp => f === 'all' ? true : f === 'act' ? sp.type !== 'client' : f === 'mine' ? sp.type === 'client' && S.clients[sp.pos].o === g.id : f === 'open' ? sp.type === 'client' && !S.clients[sp.pos].o : sp.mk === f);
    return `<div class="filters">${FILTERS.map(([k,l]) => `<button data-act="filter" data-f="${k}" class="${f===k?'on':''}">${l}</button>`).join('')}</div>
      ${S.phase === 'ended' ? '<div class="pcard tight"><b>Answer key unlocked</b><span class="muted">Every card now shows its right product.</span></div>' : ''}
      ${list.map(sp => cardTile(S, sp.pos)).join('') || '<div class="pcard tight"><span class="muted">Cards appear here as the game unfolds.</span></div>'}`;
  }
  scoresHTML(S, g){
    return `<div class="pcard"><div class="ph-turn">🏆 Leaderboard</div><div class="lbp">${standingsRowsHTML(S, g.id)}</div></div>
      <div class="pcard"><b>Team stats</b><table class="ttab stat"><tr><th>Team</th><th>Right answers</th><th>Visit fees earned</th><th>Upgrades</th></tr>${S.groups.map(x => `<tr><td>${tokHTML(x)}</td><td>${x.stats ? x.stats.ok : 0}/${x.stats ? x.stats.q : 0}</td><td>${rupee(x.stats ? x.stats.visitGot : 0)}</td><td>${x.stats ? x.stats.ups : 0}</td></tr>`).join('')}</table></div>
      <div class="note">Score = Total Relationship Value (TRV) of the clients each team holds, at their current tier. Cash covers fines, visit fees and any upgrade fees.</div>`;
  }
  /* ---------- helpers ---------- */
  cdHTML(dl, tot){ const rem = Math.max(0, dl - this.ctx.now()); return `<div class="cd" data-dl="${dl}" data-tot="${tot}" style="--p:${(rem/tot).toFixed(3)}"><span>${Math.ceil(rem/1000)}</span></div>`; }
  countdowns(){
    const now = this.ctx.now();
    $$('.cd[data-dl]', this.root).forEach(el => {
      const dl = +el.dataset.dl, tot = +el.dataset.tot || 1, rem = Math.max(0, dl - now);
      el.style.setProperty('--p', (rem/tot).toFixed(3)); el.classList.toggle('low', rem < 10000);
      const v = String(Math.ceil(rem/1000)); const sp = el.firstElementChild; if (sp && sp.textContent !== v) sp.textContent = v;
    });
  }
  setPending(){ const t = this.S && this.S.turn; this.pending = {key: t ? t.seq + ':' + t.step : ''}; }
  onInput(e){
    if (e.target.id === 'ph-name'){ this.nameDraft = e.target.value; const b = $('[data-act="join"]', this.root); if (b) b.disabled = !(cleanName(this.nameDraft) && (this.S && this.S.settings.assign === 'random' || this.pickG)) || !!this.pending; }
    if (e.target.id === 'ph-gname') this.gnameDraft = e.target.value;
  }
  onClick(e){
    const tb = e.target.closest('[data-tab]');
    if (tb){ this.tab = tb.dataset.tab; this.main.scrollTop = 0; this.render(); return; }
    const cell = e.target.closest('.miniboard .cell');
    if (cell){ this.sel = +cell.dataset.p; this.render(); return; }
    const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
    const S = this.S, t = S && S.turn;
    switch (a.dataset.act){
      case 'sheet': this.sheet = !this.sheet; this.render(); break;
      case 'pickg': this.pickG = a.dataset.g; this.render(); break;
      case 'join': {
        const n = cleanName(this.nameDraft); if (!n) return;
        const random = S.settings.assign === 'random'; if (!random && !this.pickG) return;
        store.set('pf.name', n); this.pending = {key: S.phase}; this.changeGroup = false;
        this.send('join', {n, g: random ? null : this.pickG}); this.render();
        setTimeout(() => { if (this.pending){ this.pending = null; this.render(); } }, 5000);
        break;
      }
      case 'changegroup': this.changeGroup = true; this.render(); break;
      case 'cancelchange': this.changeGroup = false; this.render(); break;
      case 'rename': { const n = cleanName(this.gnameDraft); if (n){ this.send('rename', {name:n}); this.gnameDraft = null; toast('Team name saved'); } break; }
      case 'roll': this.setPending(); this.send('roll', {seq:t.seq}); this.render(); break;
      case 'evroll': this.setPending(); this.send('evroll', {seq:t.seq}); this.render(); break;
      case 'vote': this.optim = {seq:t.seq, k:a.dataset.k}; this.send('vote', {seq:t.seq, k:a.dataset.k}); this.render(); break;
      case 'lock': {
        const g = G(S, t.gid); const k = (this.optim && this.optim.seq === t.seq && this.optim.k) || t.q.votes[g.leader];
        if (!k) return; this.setPending(); this.send('answer', {seq:t.seq, k}); this.render(); break;
      }
      case 'choose': this.setPending(); this.send('choose', {seq:t.seq, p:+a.dataset.p}); this.render(); break;
      case 'up': a.disabled = true; this.send('upgrade', {p:+a.dataset.p}); break;
      case 'filter': this.filter = a.dataset.f; this.render(); break;
    }
  }
}

/* ================= HOST CONTROLLER ================= */
const BOT_DELAY = {roll:3600, question:4200, event:1800, choose:2400};
class HostCtl {
  constructor(bus, s){
    this.bus = bus; this.s = s; this.sent = {}; this.listeners = new Set(); this.presence = {}; this.connected = bus.kind === 'demo'; this.err = null;
    bus.onIntent(it => this.onIntent(it));
    bus.onPresence(p => { this.presence = p || {}; this.emit(); });
    bus.onConn(v => { const was = this.connected; this.connected = v; if (v && !was) this.publish(true); this.emit(); });
    this.iv = setInterval(() => this.tick(), 200);
    this.publish(true);
  }
  now(){ return this.bus.now(); }
  onIntent(it){ if (!it || !it.t || !it.c) return; try { if (intentFromPhone(this.s, it, this.now())) this.commit(); } catch(e){ console.error('intent', e); } }
  tick(){
    try {
      let ch = tickEngine(this.s, this.now());
      if (this.s.mode === 'demo' && this.bots()) ch = true;
      if (ch) this.commit();
    } catch(e){ console.error(e); }
  }
  commit(){ this.publish(); this.emit(); }
  emit(){ this.listeners.forEach(f => { try { f(this.s); } catch(e){ console.error(e); } }); }
  publish(force){
    const ch = toChunks(this.s), diff = {}; let any = false;
    for (const k of CHUNKS) if (force || ch[k] !== this.sent[k]){ diff[k] = ch[k]; any = true; }
    this.sent = ch;
    if (any) Promise.resolve(this.bus.hostPublish(diff)).then(() => { if (this.err){ this.err = null; this.emit(); } }).catch(e => { console.warn('publish', e); this.err = String(e && e.message || e); this.emit(); });
    if (this.s.mode !== 'demo') store.set('pf.host.' + this.s.code, {s:this.s, db:this.db, at:Date.now()});
  }
  bots(){
    const s = this.s; if (s.phase !== 'playing' || !s.turn) return false;
    let ch = false;
    for (const g of s.groups) if (g.bot) for (const [p,c] of Object.entries(s.clients)) if (c.o === g.id && canUp(c) && upgrade(s, g.id, +p) === null) ch = true;
    const t = s.turn, g = G(s, t.gid); if (!g || !g.bot) { this.botKey = null; return ch; }
    const key = t.seq + ':' + t.step;
    if (this.botKey !== key){ this.botKey = key; this.botAt = Date.now() + (BOT_DELAY[t.step] || 0) / SPEED; return ch; }
    if (Date.now() < this.botAt) return ch;
    this.botAt = Infinity;
    if (t.step === 'roll'){ doRoll(s, this.now()); return true; }
    if (t.step === 'question'){
      const sp = SPACES[t.q.p]; const k = Math.random() < 0.65 ? sp.prod : t.q.opts[rnd(t.q.opts.length)];
      for (const m of membersOf(s, g.id)) if (Math.random() < 0.7) t.q.votes[m.cid] = Math.random() < 0.6 ? k : t.q.opts[rnd(t.q.opts.length)];
      if (g.leader) t.q.votes[g.leader] = k; answerQ(s, k, 'leader'); return true;
    }
    if (t.step === 'event'){ evRoll(s); return true; }
    if (t.step === 'choose'){ chooseNeed(s, t.ev.elig[rnd(t.ev.elig.length)]); return true; }
    return ch;
  }
  act(type, d){
    const s = this.s; let err = null;
    switch (type){
      case 'start': if (s.phase === 'lobby') err = startGame(s); break;
      case 'end': if (s.phase === 'playing') endGame(s); break;
      case 'skip': if (s.phase === 'playing') hostSkip(s); break;
      case 'roll': if (s.phase === 'playing' && s.turn){ if (s.turn.step === 'roll') doRoll(s, this.now()); else if (s.turn.step === 'event') evRoll(s); } break;
      case 'lock': if (s.turn && s.turn.step === 'question') answerQ(s, topVote(s), 'host'); break;
      case 'choose': if (s.turn && s.turn.step === 'choose') chooseNeed(s, d); break;
      case 'shuffle': if (s.phase === 'lobby'){ shuffleTeams(s); if (this.onTeams) this.onTeams(); } break;
      case 'rule': s.rule = d == null ? null : d; break;
      case 'leader': { const m = s.members[d]; if (m && m.g && G(s, m.g)){ G(s, m.g).leader = d; log(s, `${m.n} now leads ${G(s, m.g).name}`, m.g); } break; }
      case 'move': { if (s.members[d.cid] && G(s, d.g)){ assignMember(s, d.cid, d.g); log(s, `${s.members[d.cid].n} moves to ${G(s, d.g).name}`, d.g); } break; }
      case 'kick': { const m = s.members[d]; if (m){ const gid = m.g; assignMember(s, d, null); delete s.members[d]; if (gid) reassignLeader(s, gid); } break; }
      case 'setting': {
        const {k, v} = d;
        if (s.phase !== 'lobby' && k !== 'rounds' && k !== 'rotate') break;
        if (k === 'groups'){
          const prevDef = defaultSettings(s.settings.groups).rounds;
          setGroupCount(s, v);
          if (s.settings.rounds === prevDef) s.settings.rounds = defaultSettings(s.settings.groups).rounds;
          if (this.onTeams) this.onTeams();
        }
        else if (k === 'fee0' || k === 'fee1') s.settings.fee[+k.slice(3)] = v;
        else if (k === 'visit0' || k === 'visit1' || k === 'visit2'){ s.settings.visit = (s.settings.visit || [50,100,200]).slice(); s.settings.visit[+k.slice(5)] = v; }
        else if (k === 'assign'){ s.settings.assign = v === 'random' ? 'random' : 'choose'; if (this.onTeams) this.onTeams(); }
        else s.settings[k] = v;
        if (k === 'cash') s.groups.forEach(g => g.cash = v);
        break;
      }
      case 'gname': { const g = G(s, d.g), n = cleanName(d.n); if (g && n) g.name = n; break; }
      case 'reset': {
        s.phase = 'lobby'; s.turn = null; s.last = null; s.final = null; s.log = []; s.answers = []; s.rule = null;
        for (const c of Object.values(s.clients)) Object.assign(c, {o:null, t:0, e:0, s:0, r:0});
        s.groups.forEach(g => Object.assign(g, {pos:0, cash:s.settings.cash, rate:0, skip:0, led:{}, stats:freshStats()}));
        break;
      }
      case 'wipe': {
        clearInterval(this.iv); store.del('pf.host.' + s.code);
        Promise.resolve(this.bus.wipe && this.bus.wipe()).finally(() => { location.href = location.pathname; });
        return null;
      }
    }
    this.commit();
    return err;
  }
}

/* ================= DEMO (single window: display + simulated phone) ================= */
const DEMO_NAMES = ['Riya','Aman','Farah','Kabir','Meera','Joseph','Anjali','Rohan','Divya','Ishaan','Priya','Harpreet','Neha','Tanvi','Arif','Sana','Dev','Lakshmi'];
function demoMembers(s){
  s.members = {};
  s.groups.forEach((g, gi) => { g.order = []; g.leader = null; g.led = {}; for (let i=0;i<3;i++){ const cid = 'd' + g.id + (i+1); s.members[cid] = {n:DEMO_NAMES[gi*3+i], g:g.id, at:gi*10+i}; g.order.push(cid); } g.leader = g.order[0]; });
}
function startDemo(root){
  const bus = DemoBus(), s = newState('DEMO', 'demo', 4); demoMembers(s);
  const host = new HostCtl(bus, s);
  let team = 'A', role = 'leader', bots = true, phone = null, latest = null, cid = 'dA1';
  const read = makeReader();
  const pickCid = () => {
    const g = G(host.s, team) || host.s.groups[0]; team = g.id;
    const r = membersOf(host.s, g.id).map(m => m.cid);
    return role === 'leader' ? (g.leader || r[0]) : (r.find(c => c !== g.leader) || r[0]);
  };
  const setBots = () => host.s.groups.forEach(g => g.bot = bots && g.id !== team ? 1 : 0);
  host.onTeams = () => { if (host.s.settings.assign !== 'random' || !Object.values(host.s.members).some(m => m.g)) demoMembers(host.s); setBots(); fillDock(); follow(); };
  setBots();
  const disp = new Display(root, {host, demo:true, joinURL:''});
  const dock = disp.dock;
  dock.innerHTML = `<div class="dock-ctl"><div class="row"><b style="flex:1">📱 Player's phone</b><label class="switch"><input type="checkbox" id="dm-bots" checked>Bots play other teams</label></div>
    <div class="row"><select id="dm-team" aria-label="Team"></select><select id="dm-role" aria-label="Whose phone"><option value="leader">Leader this round</option><option value="member">A teammate</option></select></div>
    <div class="note">The leader role rotates every round; this phone follows it.</div></div><div class="dock-phone"></div>`;
  const selT = $('#dm-team', dock), selR = $('#dm-role', dock);
  function fillDock(){ setHTML(selT, host.s.groups.map(g => `<option value="${g.id}"${g.id === team ? ' selected' : ''}>${esc(g.name)}</option>`).join('')); }
  function mount(){
    if (phone) phone.destroy();
    phone = new Phone($('.dock-phone', dock), {cid, framed:true, code:'DEMO', now:() => Date.now(), send:(t,d) => bus.send({c:cid, t, d})});
    if (latest) phone.update(read(latest));
  }
  function follow(){
    const c = pickCid(); if (!c || c === cid) return;
    const rotated = role === 'leader' && host.s.phase === 'playing';
    cid = c; mount();
    if (rotated && phone){ const g = G(host.s, team); if (g) setTimeout(() => phone.flash(g, 'You lead this round ★', 'Roll, lock answers and confirm upgrades'), 80); }
  }
  selT.addEventListener('change', () => { team = selT.value; setBots(); host.commit(); follow(); });
  selR.addEventListener('change', () => { role = selR.value; follow(); });
  $('#dm-bots', dock).addEventListener('change', e => { bots = e.target.checked; setBots(); host.commit(); });
  bus.onState(obj => { latest = obj; follow(); if (phone) phone.update(read(obj)); fillDock(); });
  fillDock(); cid = pickCid(); mount();
  window.__pf = {host, bus, disp, get phone(){ return phone; }, setTeam(t){ selT.value = t; selT.dispatchEvent(new Event('change')); }, setRole(r){ selR.value = r; selR.dispatchEvent(new Event('change')); }};
}

/* ================= LIVE (Firebase) ================= */
const P = new URLSearchParams(location.search);
const BASE_URL = location.origin + location.pathname;
const configuredDb = () => (typeof window.PORTFOLIO_DB_URL === 'string' && validDbUrl(window.PORTFOLIO_DB_URL)) ? window.PORTFOLIO_DB_URL.trim() : '';
const dbFor = () => configuredDb() || (validDbUrl(P.get('db')) ? P.get('db') : '') || store.get('pf.db', '');
const joinUrlFor = (code, db) => BASE_URL + '?g=' + code + (configuredDb() ? '' : '&db=' + encodeURIComponent(db));
function setUrl(q){ try { history.replaceState(null, '', BASE_URL + q); } catch(e){} }
function loadingHTML(msg){ return `<div class="landing"><div class="hero"><div class="wordmark xl">PORT<b>FOLIO</b></div><div class="wait" style="justify-content:center;margin-top:18px"><span class="spin"></span>${esc(msg)}</div></div></div>`; }

async function startHostLive(root, code, db, fresh){
  root.innerHTML = loadingHTML('Opening game ' + code + '…');
  let bus;
  try { bus = await FirebaseBus(db, code); }
  catch(e){ console.error(e); root.innerHTML = loadingHTML('The game engine is still loading. Refresh the page to continue.'); return; }
  let s = null;
  if (!fresh){
    const saved = store.get('pf.host.' + code);
    if (saved && saved.s && saved.s.v === 2) s = saved.s;
    else {
      try {
        const r = makeReader()(await Promise.race([bus.snapshot(), new Promise(res => setTimeout(() => res(null), 6000))]));
        if (r && r.v === 2) s = {v:2, code, mode:'live', phase:r.phase, settings:r.settings, groups:r.groups, clients:r.clients, members:r.members, turn:r.turn, last:r.last, log:r.log, li:(r.log.length ? r.log[r.log.length-1].i : 0), final:r.final, answers:[], rule:null};
      } catch(e){ console.warn(e); }
    }
  }
  if (!s) s = newState(code, 'live', 4);
  const host = new HostCtl(bus, s); host.db = db;
  const disp = new Display(root, {host, joinURL:joinUrlFor(code, db), demo:false});
  window.__pf = {host, bus, disp};
}
async function createGame(root, db){
  store.set('pf.db', db);
  root.innerHTML = loadingHTML('Creating your game…');
  let code = newCode();
  try {
    for (let i=0;i<4;i++){
      const probe = await FirebaseBus(db, code);
      const taken = await Promise.race([probe.exists(), new Promise(r => setTimeout(() => r(false), 6000))]);
      if (!taken) break; code = newCode();
    }
  } catch(e){ console.warn(e); }
  setUrl('?host=' + code + (configuredDb() ? '' : '&db=' + encodeURIComponent(db)));
  startHostLive(root, code, db, true);
}
async function startPhoneLive(root, code, db){
  let cid = store.get('pf.cid'); if (!cid){ cid = uid(12); store.set('pf.cid', cid); }
  const ctx = {cid, code, now:() => Date.now(), send:() => {}};
  const phone = new Phone(root, ctx);
  if (!db){ morph($('.ph-main', root), `<div class="pcard"><b>Scan the QR code on the main screen</b><span class="muted">It carries everything your phone needs to join game ${esc(code)}.</span></div>`); return; }
  try {
    const bus = await FirebaseBus(db, code);
    ctx.now = bus.now; ctx.send = (t, d) => bus.send({c:cid, t, d, ts:Date.now()});
    bus.presence(cid);
    const read = makeReader();
    bus.onState(obj => phone.update(read(obj)));
    window.__pf = {phone, bus};
  } catch(e){ console.error(e); }
}

/* ================= LANDING ================= */
function recentHosts(){
  const out = [];
  try { for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k && k.startsWith('pf.host.')){ const v = store.get(k); if (v && v.s && v.s.v === 2) out.push({code:v.s.code, phase:v.s.phase, round:v.s.turn ? v.s.turn.round : 0, at:v.at || 0, db:v.db}); } } } catch(e){}
  return out.sort((a,b) => b.at - a.at).slice(0, 3);
}
function heroHTML(){
  return `<div class="hero"><div class="wordmark xl">PORT<b>FOLIO</b></div><p>Relationship banking, played in teams. Win clients with the right product, then grow them from Affluent to Wealth to Private.</p><div class="hero-strip">${TEAMS.map(t => `<span style="background:${t.color}"></span>`).join('')}</div></div>`;
}
function landing(root){
  const cfg = configuredDb(), db = dbFor(), hosts = recentHosts();
  root.innerHTML = `<div class="landing">${heroHTML()}<div class="cards3">
    <div class="panel"><div class="ic">🖥️</div><h3>Host on the big screen</h3><p class="muted">Open this on the laptop connected to the projector. Players join by scanning the code on screen.</p>
      ${cfg ? '' : `<div class="field"><label for="dburl">Firebase database URL</label><input id="dburl" class="input" placeholder="https://…firebasedatabase.app" value="${esc(db)}"></div>`}
      <button class="btn primary" data-act="host">Create a game</button>
      ${hosts.length ? `<div class="resume"><span class="note">Pick up where you left off</span>${hosts.map(h => `<button class="btn sm" data-act="resume" data-code="${h.code}" data-db="${esc(h.db || '')}">Resume ${h.code} · ${h.phase === 'playing' ? 'round ' + h.round : h.phase === 'ended' ? 'results' : 'lobby'}</button>`).join('')}</div>` : ''}
    </div>
    <div class="panel"><div class="ic">📱</div><h3>Join from your phone</h3>
      ${db ? `<div class="field"><label for="jcode">Game code</label><input id="jcode" class="input" maxlength="4" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.3em;font-weight:900;font-size:22px" placeholder="ABCD"></div><button class="btn primary" data-act="join">Join game</button>` : ''}
      <p class="note">Scanning the QR code on the main screen is the quickest way in.</p></div>
    <div class="panel"><div class="ic">🎮</div><h3>Try the demo</h3><p class="muted">The full board and a player's phone side by side in one window. Bots play the other teams.</p><button class="btn" data-act="demo">Open demo</button></div>
  </div></div>`;
  root.onclick = e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    Snd.unlock();
    if (a.dataset.act === 'host'){
      const v = cfg || ($('#dburl') ? $('#dburl').value.trim() : '');
      if (!validDbUrl(v)){ toast('Paste the database URL from Firebase. It ends in firebasedatabase.app or firebaseio.com'); return; }
      root.onclick = null; createGame(root, v);
    }
    if (a.dataset.act === 'resume'){ const d2 = a.dataset.db || db; root.onclick = null; setUrl('?host=' + a.dataset.code + (cfg ? '' : '&db=' + encodeURIComponent(d2))); startHostLive(root, a.dataset.code, d2, false); }
    if (a.dataset.act === 'join'){ const c = ($('#jcode').value || '').toUpperCase().replace(/[^A-Z]/g,''); if (c.length !== 4){ toast('Enter the 4-letter code from the main screen'); return; } location.href = joinUrlFor(c, db); }
    if (a.dataset.act === 'demo'){ root.onclick = null; setUrl('?demo'); startDemo(root); }
  };
}
function landingDemoOnly(root){
  root.innerHTML = `<div class="landing">${heroHTML()}<div class="cards3" style="max-width:880px">
    <div class="panel"><div class="ic">🎮</div><h3>Play the demo</h3><p class="muted">The projector board and a player's phone side by side. Pick any team's phone, roll, answer and upgrade. Bots play the other teams.</p><button class="btn primary" data-act="demo">Start the demo</button></div>
    <div class="panel"><div class="ic">📡</div><h3>How live play works</h3><ol class="steps"><li>The game folder goes on a free web host (GitHub Pages).</li><li>A free Firebase database carries the moves between screens.</li><li>The facilitator opens it on the projector laptop. Players scan the QR code, type a first name and join.</li></ol></div>
  </div></div>`;
  root.onclick = e => { const a = e.target.closest('[data-act="demo"]'); if (a){ root.onclick = null; Snd.unlock(); startDemo(root); } };
}

/* ================= BOOT ================= */
(function boot(){
  const theme = store.get('pf.theme', null); if (theme) document.documentElement.dataset.theme = theme;
  const root = $('#app');
  if (window.PF_BUILD && window.PF_BUILD.mode === 'demo'){ if (P.has('demo')) startDemo(root); else landingDemoOnly(root); return; }
  if (P.get('g')) return startPhoneLive(root, P.get('g').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4), dbFor());
  if (P.get('host')) { const db = dbFor(); if (db) return startHostLive(root, P.get('host').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4), db, false); }
  if (P.has('demo')) return startDemo(root);
  landing(root);
})();
